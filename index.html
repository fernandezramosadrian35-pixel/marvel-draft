<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<title>Draft 20 · Multiverso</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12; --panel:#171922; --panel2:#1f2230; --line:#2c3040;
  --gold:#e7b53c; --gold2:#ffd978; --red:#a3182b; --neon:#36c8ff;
  --ink:#eceae4; --mute:#8d92a1; --p0:#36c8ff; --p1:#ff3b52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(54,200,255,.14),transparent 60%),
   radial-gradient(120% 50% at 50% 115%,rgba(163,24,43,.30),transparent 60%),
   repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
.disp{font-family:'Bebas Neue','Impact','Arial Narrow',sans-serif;letter-spacing:.05em;font-weight:400}

#app{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.screen.active{display:flex;animation:scrIn .35s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:15px 18px;font-family:'Bebas Neue','Impact',sans-serif;
  font-size:24px;letter-spacing:.07em;color:#1a1405;background:linear-gradient(180deg,var(--gold2),var(--gold));
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.btn:disabled{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#d4283f,var(--red));color:#fff}
.btn.sm{font-size:19px;padding:11px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Setup */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:18px}
.bigcoin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:84px;color:#2a1d02;
  background:radial-gradient(circle at 32% 28%,#fff1b8,var(--gold) 55%,#9a7216);
  box-shadow:0 0 0 6px #2a1d02,0 0 0 9px var(--gold),0 0 60px rgba(231,181,60,.55);
  animation:coinSpin 5s ease-in-out infinite}
@keyframes coinSpin{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
.bigcoin span{display:block;animation:coinCounter 5s ease-in-out infinite}
@keyframes coinCounter{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-180deg)}}
.title{font-size:70px;line-height:.95;margin:18px 0 4px;color:var(--ink)}
.title em{font-style:normal;color:var(--gold)}
.sub{margin:0 12px;color:var(--mute);font-size:16px;line-height:1.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0 14px}
.panel label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
.panel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font:600 18px 'Barlow',sans-serif;padding:11px 12px;margin-bottom:12px;outline:none}
.panel input:last-child{margin-bottom:0}
.panel input:focus{border-color:var(--gold)}
#n0{border-left:4px solid var(--p0)} #n1{border-left:4px solid var(--p1)}
.rules{list-style:none;padding:0;margin:16px 4px 0;display:grid;gap:8px;color:var(--mute);font-size:14.5px;line-height:1.35}
.rules b{color:var(--ink);font-weight:600}

/* Headers */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{margin:0;font-size:30px;color:var(--gold)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer}

/* Draft */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;transition:box-shadow .25s,border-color .25s}
.pp.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 22px var(--pca)}
.pp .nm{font-weight:700;font-size:15px;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .coins{display:flex;align-items:baseline;gap:5px;margin:2px 0 6px}
.pp .coins b{font-size:34px;line-height:1;color:var(--gold2)}
.pp .coins small{color:var(--mute);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.slot{aspect-ratio:1;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:20px;background:var(--bg)}
.slot.filled{border:1px solid var(--c);background:radial-gradient(circle,var(--ca),transparent 75%);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.prog{text-align:center;color:var(--mute);font-size:13px;margin:10px 0 6px}
.acard{position:relative;margin:0 auto;width:100%;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--c);border-radius:18px;padding:18px 14px 14px;text-align:center;box-shadow:0 0 40px var(--ca)}
.acard.enter{animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:perspective(600px) rotateY(80deg) scale(.8)}to{opacity:1;transform:none}}
.ring{width:104px;height:104px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:56px;
  background:radial-gradient(circle at 32% 28%,var(--ca),#10121a 72%);box-shadow:0 0 0 3px var(--c),0 0 26px var(--ca)}
.ring.sm{width:58px;height:58px;font-size:30px;box-shadow:0 0 0 2px var(--c),0 0 14px var(--ca)}
.ring.xs{width:44px;height:44px;font-size:24px;margin:0;flex:none;box-shadow:0 0 0 2px var(--c)}
.acard h2{margin:12px 0 6px;font-size:40px;line-height:1}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.chip.hero{color:var(--neon)} .chip.villain{color:#ff6a7d}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 0}
.stats3 b{display:block;font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;color:var(--mute)}
.stats3 i{font-style:normal;font-size:11.5px;color:var(--mute)}
.status{text-align:center;margin:12px 4px 10px;font-size:16px;line-height:1.35;min-height:44px}
.status b{color:var(--gold2)}
.bidpill{display:inline-block;background:var(--gold);color:#1a1405;font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;padding:5px 14px;border-radius:99px;margin-bottom:6px}
.actions{margin-top:auto;display:grid;gap:10px;padding-top:6px}
.stepper{display:flex;align-items:center;gap:10px}
.sbtn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:58px;height:54px;border-radius:12px;font-size:28px;cursor:pointer}
.sbtn:disabled{opacity:.3}
.sval{flex:1;text-align:center;font-size:38px;color:var(--gold2)}
.note{font-size:12.5px;color:var(--mute);text-align:center}
.sold{background:linear-gradient(90deg,transparent,rgba(231,181,60,.2),transparent);padding:10px 0;animation:pop .4s}

/* Synergy / reveal */
.tblock{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;padding:10px;margin-bottom:12px}
.tblock h3{margin:0 0 8px;font-size:26px;color:var(--pc)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;transition:border-color .3s,box-shadow .3s}
.mcard.rev{border-color:var(--c);box-shadow:0 0 18px var(--ca);animation:flipIn .5s ease}
@keyframes flipIn{0%{transform:rotateY(90deg)}100%{transform:none}}
.mname{font-size:21px;margin:6px 0 3px;line-height:1}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}
.st i{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.st b{font:400 22px/1.1 'Bebas Neue',sans-serif;letter-spacing:.05em;color:var(--mute)}
.mcard.rev .st b{color:var(--ink);animation:pop .35s}
.st sup{font-size:12px;color:#5fe08a;margin-left:1px}
.synlist{display:grid;gap:7px;margin-top:10px}
.syn{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;border:1px solid var(--gold);
  background:linear-gradient(90deg,rgba(231,181,60,.22),rgba(163,24,43,.18));animation:synIn .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes synIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
.syn .si{font-size:26px}
.syn b{display:block;font:400 21px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;color:var(--gold2)}
.syn span{font-size:13px;color:var(--ink)}
.nosyn{color:var(--mute);font-size:13.5px;padding:4px 2px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;background:radial-gradient(circle,rgba(255,217,120,.85),rgba(163,24,43,.35) 60%,transparent 80%)}
#flash.go{animation:flashA .65s ease-out}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}

/* Pass */
.passwrap{margin:auto 0;text-align:center}
.passwrap .big{font-size:56px;line-height:1;margin:6px 0 14px}
.passwrap p{color:var(--mute);margin:0 0 22px;font-size:16px}
.phone{font-size:64px;animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

/* Lineup */
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:12px;padding:9px 10px;margin-bottom:8px;animation:synIn .3s ease}
.lrow .pos{font-size:34px;color:var(--gold);width:26px;text-align:center}
.lmeta{flex:1;min-width:0}
.lmeta b{display:block;font-size:24px;line-height:1}
.lmeta span{font-size:12.5px;color:var(--mute)}
.mv{display:grid;gap:4px}
.mv button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:40px;height:30px;border-radius:8px;cursor:pointer;font-size:13px}
.mv button:disabled{opacity:.25}

/* Battle */
.strip{display:flex;gap:6px;justify-content:center}
.tok{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--panel);border:1px solid var(--line);transition:.3s}
.tok.now{border-color:var(--c);box-shadow:0 0 14px var(--c)}
.tok.dead{opacity:.45;filter:grayscale(1)}
.fcard{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-left:4px solid var(--pc);border-radius:16px;padding:12px;transition:transform .17s ease,box-shadow .25s,opacity .5s,filter .5s}
.fcard.turn{box-shadow:0 0 0 1px var(--pc),0 0 24px rgba(255,255,255,.08)}
.fcard.enter{animation:fighterIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fighterIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fcard.top.enter{animation-name:fighterInTop}
@keyframes fighterInTop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.fcard.bottom.enter{animation-name:fighterInBot}
@keyframes fighterInBot{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fcard.lungeUp{transform:translateY(-24px) scale(1.04)}
.fcard.lungeDown{transform:translateY(24px) scale(1.04)}
.fcard.hit{animation:shake .3s}
.fcard.hit::after{content:"";position:absolute;inset:0;border-radius:16px;background:rgba(255,59,82,.4);animation:hitFlash .3s ease-out forwards;pointer-events:none}
@keyframes hitFlash{from{opacity:1}to{opacity:0}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fcard.dead{opacity:.35;filter:grayscale(1)}
.frow{display:flex;gap:12px;align-items:center}
.fmeta{flex:1;min-width:0}
.own{font-size:12.5px;font-weight:700}
.fname{font-size:30px;line-height:1}
.fmeta .chips{justify-content:flex-start;margin-top:4px}
.hpwrap{margin-top:10px}
.hpbar{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.hpfill{height:100%;width:100%;border-radius:99px;transition:width .45s ease,background .3s}
.hpnum{text-align:right;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;margin-top:3px;color:var(--ink)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.dmg{position:absolute;top:18%;font:400 44px/1 'Bebas Neue',sans-serif;letter-spacing:.05em;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 14px currentColor}
.dmg.red{color:#ff4d63} .dmg.gold{color:var(--gold2);font-size:56px}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-62px) scale(1)}}
.slash{position:absolute;left:8%;right:8%;top:45%;height:4px;background:linear-gradient(90deg,transparent,#fff,var(--gold2),transparent);
  transform:rotate(-14deg) scaleX(0);animation:slashA .28s ease-out forwards;box-shadow:0 0 14px var(--gold)}
@keyframes slashA{0%{transform:rotate(-14deg) scaleX(0);opacity:1}60%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}
.vs{text-align:center;padding:7px 0;min-height:42px;display:flex;align-items:center;justify-content:center;gap:10px}
.vs .v{font-size:30px;color:var(--gold);line-height:1}
#vsline{font-size:13.5px;color:var(--mute);max-width:260px;line-height:1.25}
.bctl{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.ko{position:absolute;left:50%;top:48%;font:400 120px/1 'Bebas Neue',sans-serif;color:var(--gold2);letter-spacing:.06em;
  text-shadow:0 0 34px var(--red),5px 5px 0 var(--red);opacity:0;pointer-events:none;z-index:30;transform:translate(-50%,-50%)}
.ko.show{animation:koA 1.1s ease forwards}
@keyframes koA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}}

.abox{margin-top:12px;background:var(--bg);border:1px solid var(--c);border-radius:12px;padding:10px 12px;text-align:left}
.abtype{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--gold2)}
.abox b{display:block;font-size:26px;line-height:1;margin:7px 0 4px;color:var(--ink)}
.abox p{margin:0;font-size:13.5px;line-height:1.35;color:var(--mute)}
.dmg.crit{color:var(--gold2);font-size:58px;left:4%;top:-16%;white-space:nowrap;text-shadow:0 0 22px #ff8a00,0 3px 0 #7a1020;animation:critA 1.1s ease-out forwards}
@keyframes critA{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.3) rotate(-4deg)}70%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:translateY(-40px) scale(1) rotate(-4deg)}}
.dmg.heal{color:#5fe08a;font-size:38px;white-space:nowrap}
.dmg.info{color:var(--neon);font-size:30px;white-space:nowrap}
.abrow{margin-top:8px}
.abl{font-size:12.5px;color:var(--mute);margin-bottom:3px}
.abl b{color:var(--gold2)}
.enbar{height:9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.enfill{height:100%;width:0;background:linear-gradient(90deg,#7a3cff,#c06bff);transition:width .35s}
.enfill.full{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 10px var(--gold)}
.sts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.stc{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.abn{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;opacity:0;text-align:center;font:400 22px/1.1 'Bebas Neue',sans-serif;letter-spacing:.06em;padding:10px 26px;background:linear-gradient(90deg,transparent,rgba(13,14,18,.93) 16%,rgba(13,14,18,.93) 84%,transparent);border-top:2px solid var(--pc);border-bottom:2px solid var(--pc);white-space:nowrap}
.abn b{display:block;font-size:34px;color:var(--gold2);font-weight:400}
.abn.show{animation:abnA 1s ease forwards}
@keyframes abnA{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.2)}18%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}80%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleX(1.05)}}
.fcard{padding:10px 12px}
.hpbar{height:14px}
/* Victory */
.crown{font-size:62px;text-align:center;animation:pop .6s}
.wname{font-size:62px;line-height:.95;text-align:center;margin:2px 0 4px}
.wsub{text-align:center;color:var(--mute);font-size:15px;margin-bottom:14px}
.mvp{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(231,181,60,.2),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:12px}
.mvp .ring{margin:0;width:70px;height:70px;font-size:38px;flex:none}
.mvp small{color:var(--gold2);font-weight:700;font-size:12.5px}
.mvp b{display:block;font-size:30px;line-height:1}
.mvp span{font-size:13.5px;color:var(--mute)}
.sumtab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:14px}
.sumrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.sumrow:last-child{border:0}
.sumrow .k{color:var(--mute)}
.sumrow .v{text-align:center;font-weight:700}
.sumrow.hd .v{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.05em}
.sumrow .v small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;line-height:1.2}
.btn.mode{display:flex;flex-direction:column;align-items:center;gap:3px;padding:22px 16px}
.btn.mode span{font-size:38px;line-height:1}
.btn.mode small{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.1em}
.btn.mode i{font:600 13px/1.3 'Barlow',sans-serif;font-style:normal;letter-spacing:0;opacity:.85;margin-top:5px}
.modes{display:grid;gap:16px;margin:26px 0 8px}
.note2{margin:0 2px 12px;color:var(--mute);font-size:14px;line-height:1.4}
.note2 b{color:var(--ink)}
.bcard{background:var(--panel);border:1px solid var(--c);border-radius:14px;padding:11px;margin-bottom:12px}
.bt{display:flex;gap:10px;align-items:center}
.bt b{font-size:26px;line-height:1}
.bt .chips{justify-content:flex-start;margin-top:3px}
.bstats{display:flex;gap:6px;margin-top:9px}
.bstats span{flex:1;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 0;font:400 18px/1.2 'Bebas Neue',sans-serif;color:var(--mute);letter-spacing:.06em}
.bidbar{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 24%);padding-top:16px;margin-top:auto;display:grid;gap:8px}
.bidbar .note{font-size:14px;color:var(--ink)}
.blist{display:grid;gap:8px;margin-top:16px}

let AC = null, muted = false, NB = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = .14, when = 0, slide = 0){
  if (muted) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .25, when = 0, freq = 900){
  if (muted) return; const c = ac(); if (!c) return;
  if (!NB) { NB = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = c.currentTime + when, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + dur);
}

function makeFighters(team, p){
  const cnt = {};
  team.forEach(m => cnt[m.tag] = (cnt[m.tag] || 0) + 1);
  const act = SYN.filter(s => s.test(cnt));
  const b = { hp:0, atk:0, def:0 };
  act.forEach(s => { for (const k in s.b) b[k] += s.b[k]; });
  const fin = team.map(m => {
    const bf = m.buff || { hp:0, atk:0, def:0 };           // buffs comprados en la tienda (liga Pick 3)
    const h = m.hp + bf.hp, a = m.atk + bf.atk, d = m.def + bf.def;
    return { ...m, base:{ hp:h, atk:a, def:d }, bonus:b, hp:h + b.hp, maxhp:h + b.hp, atk:a + b.atk, def:d + b.def,
      dealt:0, kills:0, alive:true, owner:p, energy:0, crit:BASECRIT[m.ab.id] || .0625, critStack:0,
      st:{ poison:0, burn:0, stun:0, shock:0, confuse:0 }, x:{}, duelHp:0 };
  });
  return { fin, syn:act };
}
function buildTeam(p){ const r = makeFighters(S.teams[p], p); S.syn[p] = r.syn; S.fin[p] = r.fin; }

// Resurrección de Deadpool y copia de seguridad de Ultron
function guard(F, p){
  if (F.hp <= 0 && F.ab.id === 'deadpool' && !F.x.revived) {
    F.x.revived = true; F.hp = Math.round(F.maxhp * .6); popup(p, '¡RESUCITA!', 'crit'); SFX.heal(); vib([60, 40, 60]);
    say(`${F.nombre} resucita con ${F.hp} HP.`);
  }
  if (F.hp > 0 && F.ab.id === 'ultron' && !F.x.backup && F.hp <= F.maxhp * .3) {
    F.x.backup = true; heal(F, p, F.maxhp * .4); say(`${F.nombre} se restaura con su copia de seguridad.`);
  }
}
function rage(F){ if ((F.x.rage || 0) < 40) { F.x.rage = (F.x.rage || 0) + 5; F.atk += 5; } }
function miss(d, t){ popup(d, t, 'info'); SFX.dodge(); return { dodged:true, dmg:0, crit:false }; }

// Aplica daño y todas las reacciones del defensor (energía, rabia, reflejos, espinas)
function takeHit(A, a, D, d, dmg, crit){
  dmg = Math.max(1, Math.round(dmg));
  D.hp = Math.max(0, D.hp - dmg); A.dealt += dmg; S.dmgTotal[a] += dmg;
  popup(d, `-${dmg} HP`, crit || dmg >= 25 ? 'gold' : 'red'); slash(d);
  const fd = $('#f' + d); fd.classList.add('hit'); setTimeout(() => fd.classList.remove('hit'), 320);
  const rd = RATE[D.ab.k]; if (rd) gain(D, rd[1]);
  if (A.ab.id === 'hulk') rage(A);
  if (D.ab.id === 'hulk') rage(D);
  if (D.ab.id === 'bp') D.x.store = (D.x.store || 0) + dmg * .25;
  if (D.hp > 0) {
    if (D.ab.id === 'cap') { const r = Math.min(Math.round(dmg * .2), Math.round(A.hp) - 1); if (r > 0) { A.hp -= r; popup(a, `-${r} HP`, 'red'); } }
    if (D.ab.id === 'groot') { const r = Math.min(6, Math.round(A.hp) - 1); if (r > 0) { A.hp -= r; popup(a, `-${r} HP`, 'red'); } }
  }
  guard(D, d);
  return dmg;
}
// Un golpe completo: esquivas, multiplicadores pasivos, crítico y daño
function strike(A, a, D, d, o = {}){
  if (!o.sure) {
    if (D.x.dodgeNext > 0) { D.x.dodgeNext--; return miss(d, 'ESQUIVA'); }
    if (DODGE[D.ab.id] && Math.random() < DODGE[D.ab.id]) return miss(d, 'ESQUIVA');
    if (D.ab.id === 'vision' && !D.x.phased) { D.x.phased = true; return miss(d, 'INTANGIBLE'); }
  }
  let dmg, crit = false;
  if (o.fixed != null) dmg = o.fixed;
  else {
    const pierce = A.ab.id === 'okoye' ? .3 : 0;
    const dfn = o.ignoreDef ? 0 : D.def * (1 - pierce);
    dmg = Math.max(5, A.atk - dfn) * (o.mult ?? 1);
    let f = 1;
    if (A.ab.id === 'punisher') f *= 1 + 2 * (1 - A.hp / A.maxhp);
    if (A.ab.id === 'moonknight') f *= 1 + .6 * (1 - A.hp / A.maxhp);
    if (A.ab.id === 'abomination' && A.hp < A.maxhp * .5) f *= 1.4;
    if (A.ab.id === 'gamora' && D.hp < D.maxhp * .5) f *= 1.3;
    if (A.ab.id === 'gorr' && (D.tag === 'Asgard' || D.tag === 'Cosmic')) f *= 1.5;
    if (A.ab.id === 'namor' && !A.x.first) { A.x.first = true; f *= 1.5; }
    if (A.x.buff > 0) { f *= 1.5; A.x.buff--; }
    if (A.st.confuse > 0) f *= .5;
    dmg *= f;
    if (A.ab.id === 'bp' && A.x.store > 0) { dmg += A.x.store; A.x.store = 0; }
    if (A.ab.id === 'docock') dmg += 8;
    if (D.ab.id !== 'drax') {
      if (A.x.guar) { crit = true; A.x.guar = false; }
      else crit = Math.random() < Math.min(1, A.crit + A.critStack);
    }

function stun(D, d, n){

// Comprueba si conviene lanzar la habilidad ahora (si no, la energía queda al 100% esperando)
function ready(A, D){

async function turnStart(F, p){

  for (const [k, pc] of [['poison', .06], ['burn', .10], ['shock', 0]]) {
    if (F.st[k] > 0) {
      F.st[k]--; const n = pc ? Math.round(F.maxhp * pc) : 15;

    case 'strange': { const g = Math.round(A.duelHp - A.hp); A.hp = A.duelHp; popup(a, `+${g} HP`, 'heal'); SFX.heal();

    case 'scarlet': { const n = Math.max(0, Math.min(Math.round(D.hp * .6), Math.round(D.hp) - 1));

    case 'loki': {

    case 'shang':
      for (let i = 0; i < 2 && D.hp > 0; i++) { strike(A, a, D, d, {}); await sleep(260); } break;
    case 'nebula':  A.x.buff = 3; strike(A, a, D, d, {}); break;

    case 'marvel':  r = strike(A, a, D, d, { mult:1.5 }); if (r.dmg > 0) heal(A, a, r.dmg); break;
    case 'hela':    strike(A, a, D, d, { fixed: Math.max(20, Math.round(D.hp * .4)), sure:true }); break;

    case 'ego':     heal(A, a, A.maxhp * .35); A.atk += 10; popup(a, 'ATK +10', 'info'); break;
    case 'mysterio': r = strike(A, a, D, d, { mult:.8 }); if (!r.dodged) { D.st.confuse = 2; popup(d, '🌀 CONFUSO', 'info'); } break;
    case 'redskull': D.maxhp = Math.round(D.maxhp * .8); D.hp = Math.min(D.hp, D.maxhp); popup(d, 'HP MÁX -20%', 'info'); strike(A, a, D, d, {}); break;
    case 'ronan': {

      break; }

function endTurn(){

async function attack(){
  if (S.busy || S.ended) return; S.busy = true; updateCtl();
  const a = S.atk, d = 1 - a, A = cur(a), D = cur(d);
  await turnStart(A, a);
  if (A.hp <= 0) { await knockout(d, a); return endTurn(); }
  if (A.st.stun > 0) {
    A.st.stun--; popup(a, 'INMOVILIZADO', 'info'); SFX.dodge(); paintStatus(a);
    say(`${A.nombre} está inmovilizado y pierde el turno.`); await sleep(750);
    S.atk = d; updateTurn(); return endTurn();
  }
  const ael = $('#f' + a);
  if (A.ab.k !== 'P' && A.energy >= 100 && ready(A, D)) {
    A.energy = 0; refresh(a); await doCast(A, a, D, d);
  } else {
    ael.classList.add(a === 0 ? 'lungeUp' : 'lungeDown'); await sleep(170); SFX.hit(); vib(30);
    await normalAttack(A, a, D, d);
    const r = RATE[A.ab.k]; if (r) gain(A, r[0]);
    await sleep(280); ael.classList.remove('lungeUp', 'lungeDown');
  }
  refresh(0); refresh(1);
  if (D.hp <= 0) { await knockout(a, d); return endTurn(); }
  if (A.st.confuse > 0) { A.st.confuse--; paintStatus(a); }
  S.atk = d; updateTurn(); await sleep(200); endTurn();
}
async function knockout(a, d){
  const A = cur(a), D = cur(d);
  D.alive = false; D.hp = 0; A.kills++; SFX.ko(); vib([60, 40, 100]); flash();
  refresh(d); $('#f' + d).classList.add('dead'); paintStrip(d);
  const ko = $('#ko'); ko.classList.remove('show'); void ko.offsetWidth; ko.classList.add('show');
  say(`${D.nombre} cae. ${A.nombre} sigue en pie con ${Math.round(A.hp)} HP.`);
  await sleep(1150);
  const ni = nextAlive(d);
  if (ni < 0) { S.ended = true; endGame(a); return; }
  S.pos[d] = ni; beginDuel(); paintFighter(d, true); paintFighter(a, false); paintStrip(d); paintStrip(a);
  S.atk = d; updateTurn(); say(`${cur(d).nombre} entra al ring.`);
  SFX.bid(); await sleep(650);
}

function confetti(){
  const cv = $('#confetti'), cx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.display = 'block';
  const cols = ['#e7b53c', '#ffd978', '#ff3b52', '#36c8ff', '#ffffff', '#a3182b'];
  const P = Array.from({ length: 150 }, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height * .6, w: (6 + Math.random() * 8) * dpr, h: (8 + Math.random() * 10) * dpr,
    vy: (2 + Math.random() * 4) * dpr, vx: (Math.random() - .5) * 3 * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function loop(t){
    cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (t - t0 < 6000 && P.some(p => p.y < cv.height + 30)) requestAnimationFrame(loop);
    else { cx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  })(t0);
}

const ACT = {
  start(){
    let a = $('#n0').value.trim() || 'Jugador 1', b = $('#n1').value.trim() || 'Jugador 2';
    if (a.toLowerCase() === b.toLowerCase()) b += ' 2';
    resetColors(); SFX.bid(); newGame([a, b]); startRound(); show('draft');
  },
  mute(){ muted = !muted; document.querySelectorAll('[data-act="mute"]').forEach(b => b.textContent = muted ? '🔇' : '🔊'); if (!muted) SFX.click(); },
  openMinus(){ S.openBid = Math.max(1, S.openBid - 1); SFX.click(); renderDraft(); },
  openPlus(){ S.openBid = Math.min(maxBid(S.opener), S.openBid + 1); SFX.click(); renderDraft(); },
  openConfirm(){
    if (S.phase !== 'open') return;
    S.bid = S.openBid; S.bidder = S.opener; S.turn = 1 - S.opener; S.phase = 'respond'; SFX.bid(); renderDraft();
  },
  raise(){
    if (S.phase !== 'respond' || S.bid + 1 > maxBid(S.turn)) return;
    S.bid++; S.bidder = S.turn; S.turn = 1 - S.turn; SFX.raise(); renderDraft();
  },
  cede(){ if (S.phase !== 'respond') return; award(S.bidder, S.bid); },
  claim(){ if (S.phase !== 'auto') return; award(S.autoP, 1); },
  reveal(){ revealStats(); },
  toLineup(){
    S.lineupP = 0; SFX.click();
    showPass(0, () => { renderLineup(); show('lineup'); }, 'Hora de alinear. Pasa el móvil a');
  },
  passOk(){ SFX.click(); if (S.passNext) S.passNext(); },
  up(b){ moveFighter(+b.dataset.i, -1); },
  down(b){ moveFighter(+b.dataset.i, 1); },
  lineupOk(){
    SFX.bid();
    if (S.lineupP === 0) { S.lineupP = 1; showPass(1, () => { renderLineup(); show('lineup'); }, 'Ahora te toca. Pasa el móvil a'); }
    else startBattle();
  },
  attack(){ if (!S.auto) attack(); },
  auto(){
    if (S.ended) return; S.auto = !S.auto; SFX.click(); updateCtl();
    if (S.auto && !S.busy) attack();
  },
  async share(){
    const t = shareText();
    try {
      if (navigator.share) { await navigator.share({ text: t }); return; }
      await navigator.clipboard.writeText(t); toast('Resumen copiado');
    } catch (e) {
      try {
        const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('Resumen copiado');
      } catch (e2) { toast('No se pudo copiar'); }
    }
  },
  again(){ SFX.click(); const n = S ? S.names : null; if (S && S.pick) renderSetupPick2(n); else renderSetup(n); show('setup'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { if (!['mute', 'attack', 'auto', 'openMinus', 'openPlus', 'up', 'down', 'passOk', 'start', 'again'].includes(b.dataset.act)) SFX.click(); f(b); }
});

  T = { names, mode, coins:mode === 'pick' ? [0, 0, 0, 0] : [20, 20, 20, 20], spent:[0, 0, 0, 0], teams:[[], [], [], []], deck:shuffle(CHARS), deckPos:0, draft:0,
        order:[], cards:[], bids:[], bidIdx:0, cur:[], curPid:0, res:[], ri:0, rows:[], rvBusy:false, rvDone:false,
        phase:'', pairs:[], di:0, prevKey:null, log:[], perf:{}, fx:[], lp:0, passNext:null, dfx:[], duelPids:[0, 1],
        picks:[], shopI:0, shopPid:0, shopNext:null, shopActive:false,
        stats:[0, 1, 2, 3].map(() => ({ dmg:0, crits:0, kills:0, wins:0 })) };
}

/* ---------- Drafts de pujas secretas ---------- */
function startDraft(){
  if (T.mode === 'pick') return startPickDraft();
  T.draft++;
  T.cards = T.deck.slice(T.deckPos, T.deckPos + 4); T.deckPos += 4;
  T.order = shuffle([0, 1, 2, 3]); T.bids = [[], [], [], []]; T.bidIdx = 0;
  tshow(`
    <div class="head"><h2 class="disp">Draft ${T.draft} de 4</h2>${muteBtn()}</div>
    <p class="note2">Puja secreta: cada jugador ve los <b>mismos 4 personajes</b> y fija su <b>puja máxima</b> por cada uno (mínimo 1). Las pujas no se suman. Gana la puja más alta de toda la mesa; ese jugador sale de la ronda y los demás siguen disputando los personajes libres con sus pujas intactas, hasta que cada uno se lleve <b>exactamente 1</b> y pague lo que pujó por él.</p>
    <div class="sumtab">${[0, 1, 2, 3].map(i => `<div class="sumrow" style="grid-template-columns:1fr auto"><div>${tn(i)}</div><div class="v">${T.coins[i]} 🪙</div></div>`).join('')}</div>
    <p class="note2">Orden de turno (aleatorio, decide los empates): ${T.order.map((p, i) => `${i + 1}. ${tn(p)}`).join(' · ')}</p>
    ${T.draft === 3 ? '<p class="note2">Ojo: en el Draft 3 tu puja máxima baja 1 🪙, para que te quede al menos 1 🪙 en el Draft 4.</p>' : ''}
    <div class="actions"><button class="btn" data-act="tStartBids">Empezar pujas</button></div>`);
}

function paintBid(pid){

// Resolución por puja récord: en cada ronda gana la puja más alta de todas las que siguen vivas (jugadores y personajes libres).
// El ganador paga su puja y sale; los demás conservan sus pujas intactas sobre los personajes que quedan.
// Empate: quien pujó antes en el orden de turno.
function resolveBids(){
  const free = new Set([0, 1, 2, 3]); let act = T.order.slice();
  const res = [], steps = [];
  while (act.length) {
    let best = null;
    for (const pid of act) for (const ci of free) {
      const b = T.bids[pid][ci], oi = T.order.indexOf(pid);
      if (!best || b > best.b || (b === best.b && (oi < best.oi || (oi === best.oi && ci < best.ci)))) best = { pid, ci, b, oi };
    }
    const rows = act.map(pid => ({ pid, b:T.bids[pid][best.ci] })).sort((x, y) => y.b - x.b || T.order.indexOf(x.pid) - T.order.indexOf(y.pid));
    steps.push({ ci:best.ci, pid:best.pid, price:best.b, rows });
    res[best.ci] = { pid:best.pid, price:best.b };
    act = act.filter(q => q !== best.pid); free.delete(best.ci);
  }
  T.steps = steps; return res;
}
function startReveal(){ T.res = resolveBids(); T.ri = 0; renderReveal(); }

  const st = T.steps[T.ri], c = T.cards[st.ci];

    <p class="note2">${T.ri === 0 ? 'Se evalúa primero la <b>puja más alta de toda la mesa</b>.' : `Ya tienen personaje: ${out.map(i => tn(i)).join(', ')}. Los demás siguen con sus pujas intactas.`}</p>
    <div class="acard enter" style="--c:${tc(c.tag)};--ca:${tc(c.tag)}55">
      <div class="ring"><span>${c.icono}</span></div>
      <h2 class="disp">${esc(c.nombre)}</h2>
      <div class="chips"><span class="chip ${c.rol === 'Hero' ? 'hero' : 'villain'}">${c.rol === 'Hero' ? 'Héroe' : 'Villano'}</span><span class="chip" style="color:${tc(c.tag)}">${c.tag}</span></div>
      <div class="abox"><span class="abtype">${KINDLBL[c.ab.k]}</span><b class="disp">${esc(c.ab.n)}</b><p>${esc(c.ab.d)}</p></div>
    </div>
    <div class="blist">${T.rows.map((r, i) => `<div class="brow" id="br${i}" style="--pc:${PC4[r.pid]}"><span class="bn">${esc(T.names[r.pid])}</span><span class="bv disp" id="brv${i}">???</span><span class="btag" id="brt${i}"></span></div>`).join('')}</div>
    <div class="actions"><button class="btn" id="rvBtn" data-act="rvReveal">Revelar pujas</button></div>`);
}
async function rvReveal(){
  if (T.rvBusy || T.rvDone) return; T.rvBusy = true; $('#rvBtn').disabled = true;
  const st = T.steps[T.ri], rows = T.rows;
  for (let i = rows.length - 1; i >= 0; i--) {
    $('#brv' + i).textContent = rows[i].b + ' 🪙'; $('#br' + i).classList.add('on'); SFX.flip(); vib(15); await sleep(650);
  }
  await sleep(300);
  rows.forEach((r, i) => {
    const t = $('#brt' + i);
    if (r.pid === st.pid) { $('#br' + i).classList.add('win'); t.textContent = T.ri === 0 ? '¡PUJA RÉCORD! SE LO LLEVA' : '¡SE LO LLEVA!'; }
    else t.textContent = 'sigue en la subasta';
  });
  SFX.synergy(); flash(); vib([40, 30, 80]);
  T.rvDone = true; T.rvBusy = false;
  const btn = $('#rvBtn'); btn.disabled = false; btn.dataset.act = 'rvNext'; btn.textContent = T.ri < 3 ? 'Siguiente ronda' : 'Continuar';
}
function finishDraft(){
  T.res.forEach((r, ci) => { T.coins[r.pid] -= r.price; T.spent[r.pid] += r.price; T.teams[r.pid].push(T.cards[ci]); });
  const rows = [0, 1, 2, 3].map(pid => {
    const ci = T.res.findIndex(r => r.pid === pid), c = T.cards[ci];
    return `<div class="lrow" style="--c:${tc(c.tag)}"><div class="ring xs" style="--ca:${tc(c.tag)}55"><span>${c.icono}</span></div>
      <div class="lmeta"><b class="disp">${esc(c.nombre)}</b><span style="color:${PC4[pid]}">${esc(T.names[pid])}</span>
      <span style="display:block">Pagó ${T.res[ci].price} 🪙 · le quedan ${T.coins[pid]} 🪙</span></div></div>`;
  }).join('');
  const lbl = ['', 'Ir a los duelos 1v1', 'Ir a los duelos 2v2', 'Siguiente: Draft 4', 'Sinergias y torneo final'][T.draft];
  tshow(`<div class="head"><h2 class="disp">Draft ${T.draft} completado</h2>${muteBtn()}</div>${rows}
    <div class="actions"><button class="btn" data-act="tAfterDraft">${lbl}</button></div>`);

/* ---------- Emparejamientos y duelos ---------- */
function pickPairs(){
  const opts = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  const key = o => o.map(x => x.slice().sort().join('')).sort().join('|');
  let pool = opts.filter(o => key(o) !== T.prevKey); if (!pool.length) pool = opts;
  const o = pool[Math.random() * pool.length | 0]; T.prevKey = key(o);
  return shuffle(o.map(pr => shuffle(pr)));
}
const phaseTitle = () => ({ 1:'Fase 1 · Duelos 1v1', 2:'Fase 2 · Duelos 2v2', semi:'Semifinales 4v4', final:'Gran Final 4v4' })[T.phase];
const phaseSize = () => ({ 1:1, 2:2, semi:4, final:4 })[T.phase];
function startPhase(ph){ T.phase = ph; T.pairs = pickPairs(); T.di = 0; showPairings(); }
function showPairings(){
  const hint = ({
    1:'Cada uno pelea con el único personaje que ha conseguido. Ganadores +10 🪙, perdedores +5 🪙.',
    2:'Survival con 2 personajes: el que gana un duelo conserva su vida para el siguiente. Ganadores +20 🪙, perdedores +10 🪙. Antes de cada duelo, cada jugador ordena sus luchadores en secreto.',
    semi:'Survival 4v4. Antes de cada duelo, cada jugador ordena sus luchadores en secreto. Los dos ganadores pasan a la Gran Final.',
    final:'Los finalistas vuelven a ordenar a sus luchadores en secreto. El ganador se proclama campeón del torneo.' })[T.phase];
  const side = pid => `<div class="side">${tn(pid)}<div class="mini">${T.teams[pid].slice(0, phaseSize()).map(c => `<span>${c.icono}</span>`).join('')}</div></div>`;
  tshow(`<div class="head"><h2 class="disp">${phaseTitle()}</h2>${muteBtn()}</div>
    <p class="note2">${hint}</p>
    ${T.pairs.map((pr, i) => `<div class="match">${side(pr[0])}<div class="vsm">VS</div>${side(pr[1])}</div>`).join('')}
    <div class="actions"><button class="btn" data-act="tNextDuel">${T.pairs.length > 1 ? 'Primer duelo' : 'Ir al duelo'}</button></div>`);
}
function runDuel(){
  const [a, b] = T.pairs[T.di], size = phaseSize();
  const fa = makeFighters(T.teams[a].slice(0, size), 0), fb = makeFighters(T.teams[b].slice(0, size), 1);
  T.dfx = [fa, fb]; T.duelPids = [a, b];
  PCOL[0] = PC4[a]; PCOL[1] = PC4[b]; PCOLA[0] = PC4A[a]; PCOLA[1] = PC4A[b];
  S = { names:[T.names[a], T.names[b]], fin:[fa.fin, fb.fin], syn:[fa.syn, fb.syn], pos:[0, 0], atk:0, auto:false, busy:false,
        ended:false, dmgTotal:[0, 0], crits:[0, 0], onEnd:w => duelEnd(a, b, w) };
  const block = (pid, r) => `<div class="tblock" style="--pc:${PC4[pid]}"><h3 class="disp">${esc(T.names[pid])}</h3>
    ${r.fin.map((m, i) => `<div class="lrow" style="--c:${tc(m.tag)}">${r.fin.length > 1 ? `<div class="pos disp">${i + 1}</div>` : ''}<div class="ring xs" style="--ca:${tc(m.tag)}55"><span>${m.icono}</span></div>
      <div class="lmeta"><b class="disp">${esc(m.nombre)}</b><span>HP ${m.hp} · ATK ${m.atk} · DEF ${m.def}</span>
      <span style="display:block;color:var(--gold2)">${esc(m.ab.n)} · ${KINDLBL[m.ab.k]}</span></div></div>`).join('')}
    ${r.syn.map(s => `<div class="syn"><div class="si">${s.ico}</div><div><b>${s.name}</b><span>${bonusTxt(s.b)} a todos</span></div></div>`).join('')}</div>`;
  tshow(`<div class="head"><h2 class="disp">${phaseTitle()}</h2>${muteBtn()}</div>
    <p class="note2">Duelo ${T.di + 1} de ${T.pairs.length}. Aquí tenéis las stats reales${(fa.syn.length || fb.syn.length) ? ' con sus sinergias' : ''}.</p>
    ${block(a, fa)}${block(b, fb)}
    <div class="actions"><button class="btn red" data-act="tFight">¡A la arena!</button></div>`);
  SFX.bid();
}
function duelEnd(a, b, w){
  const pids = [a, b], win = pids[w], lose = pids[1 - w];
  [0, 1].forEach(sd => {
    const pid = pids[sd], st = T.stats[pid];
    st.dmg += S.dmgTotal[sd]; st.crits += S.crits[sd];
    S.fin[sd].forEach(f => {
      st.kills += f.kills;
      const k = pid + ':' + f.id, e = T.perf[k] || (T.perf[k] = { pid, nombre:f.nombre, icono:f.icono, tag:f.tag, dealt:0, kills:0 });
      e.dealt += f.dealt; e.kills += f.kills;
    });
  });
  T.stats[win].wins++;
  const surv = S.fin[w].filter(f => f.alive);
  const bonus = T.phase === 1 ? [10, 5] : T.phase === 2 ? [20, 10] : null;
  if (bonus) { T.coins[win] += bonus[0]; T.coins[lose] += bonus[1]; }
  T.log.push({ phase:T.phase, a, b, win, lose });
  SFX.win(); vib([60, 40, 60]);
  tshow(`<div class="crown">⚔️</div>
    <div class="wname disp" style="color:${PC4[win]};font-size:52px">${esc(T.names[win])}</div>
    <div class="wsub">gana el duelo a ${esc(T.names[lose])}</div>
    <div class="tblock" style="--pc:${PC4[win]}"><h3 class="disp">Supervivientes</h3>
      ${surv.map(f => `<div class="lrow" style="--c:${tc(f.tag)}"><div class="ring xs" style="--ca:${tc(f.tag)}55"><span>${f.icono}</span></div>
        <div class="lmeta"><b class="disp">${esc(f.nombre)}</b><span>${Math.round(f.hp)} / ${Math.round(f.maxhp)} HP · ${f.kills} K.O.</span></div></div>`).join('')}</div>
    ${bonus ? `<div class="sumtab"><div class="sumrow" style="grid-template-columns:1fr auto"><div>${tn(win)} (ganador)</div><div class="v">+${bonus[0]} 🪙</div></div>
      <div class="sumrow" style="grid-template-columns:1fr auto"><div>${tn(lose)} (perdedor)</div><div class="v">+${bonus[1]} 🪙</div></div></div>` : ''}
    <div class="actions"><button class="btn" data-act="tAfterDuel">Continuar</button></div>`);
}
function afterDuel(){
  T.di++;
  if (T.di < T.pairs.length) return duelLineups();
  if (T.phase === 1 || T.phase === 2) return T.mode === 'pick' ? startShop(() => startDraft()) : startDraft();
  if (T.phase === 'semi') {
    const sm = T.log.filter(l => l.phase === 'semi');
    T.phase = 'final'; T.pairs = [[sm[0].win, sm[1].win]]; T.di = 0; return showPairings();
  }
  renderChampion();
}

/* ---------- Fase final: sinergias, alineación y torneo ---------- */

function startFinal(){
  T.phase = 'syn'; T.revealed = false;
  T.fx = [0, 1, 2, 3].map(pid => makeFighters(T.teams[pid], 0));

    <div class="actions" style="padding-bottom:4px"><button class="btn" id="tsBtn" data-act="tRevealSyn">Revelar stats y sinergias</button></div>`);

async function revealSyn4(){
  if (T.revealed) return; T.revealed = true;
  const btn = $('#tsBtn'); btn.disabled = true;
  for (let p = 0; p < 4; p++) for (let i = 0; i < T.fx[p].fin.length; i++) {
    const m = T.fx[p].fin[i], card = $('#tm' + p + i);
    card.classList.add('rev'); SFX.flip(); vib(12);
    card.querySelectorAll('b[data-k]').forEach(bb => { const k = bb.dataset.k, bo = m.bonus[k]; bb.innerHTML = m[k] + (bo ? `<sup>+${bo}</sup>` : ''); });
    await sleep(170);
  }
  await sleep(250);
  for (let p = 0; p < 4; p++) {
    const box = $('#tsyn' + p);
    if (!T.fx[p].syn.length) { box.innerHTML = '<div class="nosyn">Sin sinergias activas.</div>'; continue; }
    for (const sy of T.fx[p].syn) {
      box.insertAdjacentHTML('beforeend', `<div class="syn"><div class="si">${sy.ico}</div><div><b>${sy.name}</b><span>${bonusTxt(sy.b)} a todos</span></div></div>`);
      SFX.synergy(); flash(); vib([30, 30, 60]); await sleep(600);
    }
  }
  btn.textContent = 'Ir a las semifinales'; btn.dataset.act = 'tToSemis'; btn.disabled = false;
}
// Antes de cada duelo con 2 o más personajes por jugador: orden secreto de cada duelista. Con 1 personaje se salta.
function duelLineups(){
  if (phaseSize() < 2) return runDuel();
  T.lq = T.pairs[T.di].slice(); T.lqi = 0; lineupNext();
}
function lineupNext(){
  if (T.lqi >= T.lq.length) return runDuel();
  const pid = T.lq[T.lqi]; T.lpid = pid;
  passScreen(T.names[pid], PC4[pid], `Ordena tu equipo en secreto (${phaseTitle()}). Pasa el móvil a`, () => renderLineup4(pid, true), `Soy ${T.names[pid]}`);
}
function renderLineup4(pid, anim){
  const fin = makeFighters(T.teams[pid], 0).fin, opp = T.lq.find(q => q !== pid), n = fin.length;
  const html = `<div class="head"><h2 class="disp" style="color:${PC4[pid]}">Alineación de ${esc(T.names[pid])}</h2>${muteBtn()}</div>
    <p class="note2">Te enfrentas a ${tn(opp)}. La posición 1 sale al ring primero; el ganador de cada duelo sigue herido, así que decide quién abre y quién cierra.</p>
    ${fin.map((m, i) => `<div class="lrow" style="--c:${tc(m.tag)}"><div class="pos disp">${i + 1}</div>
      <div class="ring xs" style="--ca:${tc(m.tag)}55"><span>${m.icono}</span></div>
      <div class="lmeta"><b class="disp">${esc(m.nombre)}</b><span>HP ${m.hp} · ATK ${m.atk} · DEF ${m.def}</span><span style="display:block;color:var(--gold2)">${esc(m.ab.n)} · ${KINDLBL[m.ab.k]}</span></div>
      <div class="mv"><button data-act="tUp" data-i="${i}" ${i === 0 ? 'disabled' : ''}>▲</button><button data-act="tDown" data-i="${i}" ${i === n - 1 ? 'disabled' : ''}>▼</button></div></div>`).join('')}
    <div class="actions"><button class="btn" data-act="tLineupOk">Confirmar orden</button></div>`;
  if (anim) tshow(html); else $('#scr-t').innerHTML = html;
}
function moveT(i, d){
  const a = T.teams[T.lpid], j = i + d; if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; SFX.click(); renderLineup4(T.lpid, false);
}

/* ---------- Campeón ---------- */

  return `🏆 Draft 20 · Liga & Torneo\nCampeón: ${T.names[f.win]}\nGran final: ${T.names[f.win]} vence a ${T.names[f.lose]}\n` +
    `MVP: ${m.icono} ${m.nombre} de ${T.names[m.pid]} (${m.dealt} de daño, ${m.kills} K.O.)\n` +
    [0, 1, 2, 3].map(i => `${T.names[i]}: ${T.spent[i]} 🪙 gastadas, ${T.stats[i].dmg} de daño, ${T.stats[i].crits} críticos`).join('\n');
}
function renderChampion(){
  const f = T.log.find(l => l.phase === 'final'), semis = T.log.filter(l => l.phase === 'semi');
  T.mvp = Object.values(T.perf).sort((x, y) => y.dealt - x.dealt || y.kills - x.kills)[0];
  const m = T.mvp;
  const hon = (ic, pid, txt, g) => `<div class="h ${g ? 'g' : ''}"><div class="m">${ic}</div><div class="n" style="color:${PC4[pid]}">${esc(T.names[pid])}<small>${txt}</small></div></div>`;
  tshow(`<div class="crown">🏆</div>
    <div class="wname disp" style="color:${PC4[f.win]}">${esc(T.names[f.win])}</div>
    <div class="wsub">Campeón del torneo</div>
    <div class="honor">
      ${hon('🥇', f.win, 'Campeón', true)}${hon('🥈', f.lose, 'Finalista')}
      ${semis.map(l => hon('🥉', l.lose, 'Semifinalista')).join('')}
    </div>
    <p class="note2">${semis.map((l, i) => `Semifinal ${i + 1}: ${tn(l.a)} vs ${tn(l.b)} → <b>${esc(T.names[l.win])}</b>`).join('<br>')}<br>Gran final: ${tn(f.a)} vs ${tn(f.b)} → <b>${esc(T.names[f.win])}</b></p>
    <div class="mvp" style="--c:${tc(m.tag)};--ca:${tc(m.tag)}55"><div class="ring"><span>${m.icono}</span></div>
      <div><small>MVP global del torneo</small><b class="disp">${esc(m.nombre)}</b><span>${m.dealt} de daño · ${m.kills} K.O. · de ${esc(T.names[m.pid])}</span></div></div>
    <div class="sumtab t5">
      <div class="sumrow hd"><div></div>${[0, 1, 2, 3].map(i => `<div class="v" style="color:${PC4[i]}">${esc(T.names[i])}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">Monedas gastadas</div>${T.spent.map(v => `<div class="v">${v}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">Daño total</div>${T.stats.map(v => `<div class="v">${v.dmg}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">Críticos</div>${T.stats.map(v => `<div class="v">${v.crits}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">K.O.</div>${T.stats.map(v => `<div class="v">${v.kills}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">Victorias</div>${T.stats.map(v => `<div class="v">${v.wins}</div>`).join('')}</div>
      <div class="sumrow"><div class="k">Sinergias</div>${T.fx.map(x => `<div class="v"><small>${x.syn.length ? x.syn.map(s => s.name).join(', ') : '—'}</small></div>`).join('')}</div>
    </div>
    <div class="actions" style="padding-bottom:4px"><button class="btn" data-act="tShare">Compartir resumen</button>
      <button class="btn ghost" data-act="tAgain">Nuevo torneo</button>
      <button class="btn ghost sm" data-act="toMode">Cambiar de modo</button></div>`);
  SFX.win(); vib([80, 50, 80, 50, 160]); confetti();
}

/* ============================== MODO PICK 3 (SELECCIÓN) ============================== */
const TAG2SYN = { Avengers:'avengers', Tech:'tech', Asgard:'cosmic', Cosmic:'cosmic', Multiverse:'multi', Villains:'villains', Guardians:'guardians', Street:'street', Wakanda:'wakanda' };
let PK = { cards:[], sel:-1, cb:null };
// 3 personajes al azar entre los que nadie tiene todavía (los descartados vuelven al mazo común)
const drawThree = owned => shuffle(CHARS.filter(c => !owned.has(c.id))).slice(0, 3);
function synHint(c, team){
  const sy = SYN.find(x => x.id === TAG2SYN[c.tag]); if (!sy) return '';
  const n = team.filter(m => TAG2SYN[m.tag] === sy.id).length, hot = n + 1 >= 2;
  const grp = sy.id === 'cosmic' ? 'Asgard/Cosmic' : c.tag;
  return `<div class="synline ${hot ? 'hot' : ''}">${sy.ico} <b>${sy.name}</b> · ${bonusTxt(sy.b)} a todos con 2+ ${grp}<br>${n ? `Llevas ${n} de este grupo.` : 'Aún no llevas ninguno de este grupo.'}${hot ? ' <b>¡Con este activas la sinergia!</b>' : ''}</div>`;
}
function pickCard(c, i, team){
  return `<div class="bcard pk" id="pk${i}" data-act="pkSel" data-i="${i}" style="--c:${tc(c.tag)};--ca:${tc(c.tag)}55">
    <div class="bt"><div class="ring xs"><span>${c.icono}</span></div>
      <div><b class="disp">${esc(c.nombre)}</b><div class="chips"><span class="chip ${c.rol === 'Hero' ? 'hero' : 'villain'}">${c.rol === 'Hero' ? 'Héroe' : 'Villano'}</span><span class="chip" style="color:${tc(c.tag)}">${c.tag}</span></div></div></div>
    <div class="bstats"><span>HP ???</span><span>ATK ???</span><span>DEF ???</span></div>
    <div class="abox"><span class="abtype">${KINDLBL[c.ab.k]}</span><b class="disp">${esc(c.ab.n)}</b><p>${esc(c.ab.d)}</p></div>
    ${synHint(c, team)}
  </div>`;
}
function renderPick(o){
  PK = { cards:o.cards, sel:-1, cb:o.cb };
  tshow(`<div class="head"><h2 class="disp" style="color:${o.color}">${esc(o.title)}</h2>${muteBtn()}</div>
    <p class="note2">${o.note}</p>
    ${o.cards.map((c, i) => pickCard(c, i, o.team)).join('')}
    <div class="bidbar"><button class="btn" id="pkBtn" data-act="pkOk" disabled>Elige un personaje</button></div>`);
}
const teamIcons = t => t.length ? t.map(c => c.icono).join(' ') : 'vacío';

/* ---- Pick 3 · 2 jugadores ---- */
function renderSetupPick2(prev){
  const n = prev || ['Jugador 1', 'Jugador 2'];
  $('#scr-setup').innerHTML = `
    <div class="hero">
      <div class="bigcoin disp"><span>3</span></div>
      <h1 class="title disp">Pick <em>3</em></h1>
      <p class="sub">En tu turno ves 3 personajes al azar con las stats ocultas. Eliges 1 y se lo quitas a tu rival.</p>
    </div>
    <div class="panel">
      <label for="n0">Jugador 1</label>
      <input id="n0" maxlength="14" value="${esc(n[0])}" autocomplete="off">
      <label for="n1">Jugador 2</label>
      <input id="n1" maxlength="14" value="${esc(n[1])}" autocomplete="off">
    </div>
    <button class="btn" data-act="startPick2">Empezar draft</button>
    <button class="btn ghost sm" data-act="toMode" style="margin-top:10px">Cambiar de modo</button>
    <ul class="rules">
      <li><b>Elección:</b> los 2 descartados vuelven al mazo; el elegido queda bloqueado.</li>
      <li><b>Turnos:</b> el que empieza la ronda alterna (1-2, 2-1, 2-1, 1-2) para compensar.</li>
      <li><b>Combate:</b> sinergias, alineación secreta y 4v4 como siempre.</li>
    </ul>`;
}
// Orden en serpiente: 1-2, 2-1, 2-1, 1-2 (ningún jugador elige siempre primero)
function pickPlayer2(){ const r = S.pkIdx >> 1, k = S.pkIdx & 1; return r % 2 === 0 ? k : 1 - k; }
function nextPick2(){
  if (S.pkIdx >= 8) return goSynergy();
  const p = pickPlayer2(), r = (S.pkIdx >> 1) + 1;
  showPass(p, () => {
    const owned = new Set([...S.teams[0], ...S.teams[1]].map(c => c.id));
    renderPick({ title:`Elige, ${S.names[p]}`, color:PCOL[p], cards:drawThree(owned), team:S.teams[p],
      note:`Ronda ${r} de 4. Tu equipo: ${teamIcons(S.teams[p])}. Elige 1 de estos 3: se retira del mazo y no le saldrá a tu rival.`,
      cb:c => { S.teams[p].push(c); S.pkIdx++; nextPick2(); } });
  }, `Ronda ${r} de 4 · elección ${(S.pkIdx & 1) + 1} de 2. Pasa el móvil a`);
}

/* ---- Pick 3 · liga de 4 jugadores ---- */
function startPickDraft(){
  T.draft++; T.order = shuffle([0, 1, 2, 3]); T.bidIdx = 0; T.picks = [];
  const showCoins = T.coins.some(c => c > 0);
  tshow(`
    <div class="head"><h2 class="disp">Draft ${T.draft} de 4 · Pick 3</h2>${muteBtn()}</div>
    <p class="note2">En tu turno verás <b>3 personajes al azar</b> (stats ocultas, con habilidad y sinergias) y elegirás <b>1</b>. Lo elegido se retira del mazo y los descartados pueden volver a salir. Cada jugador se lleva exactamente 1 por draft.</p>
    ${showCoins ? `<div class="sumtab">${[0, 1, 2, 3].map(i => `<div class="sumrow" style="grid-template-columns:1fr auto"><div>${tn(i)}</div><div class="v">${T.coins[i]} 🪙 para la tienda</div></div>`).join('')}</div>` : ''}
    <p class="note2">Orden de turno (aleatorio): ${T.order.map((p, i) => `${i + 1}. ${tn(p)}`).join(' · ')}</p>
    <div class="actions"><button class="btn" data-act="tStartBids">Empezar elecciones</button></div>`);
}
function nextPicker(){
  if (T.bidIdx >= 4) return finishPickDraft();
  const pid = T.order[T.bidIdx];
  passScreen(T.names[pid], PC4[pid], `Elección ${T.bidIdx + 1} de 4 (Draft ${T.draft}). Pasa el móvil a`, () => {
    const owned = new Set(T.teams.flat().map(c => c.id));
    renderPick({ title:`Elige, ${T.names[pid]}`, color:PC4[pid], cards:drawThree(owned), team:T.teams[pid],
      note:`Draft ${T.draft} · elección ${T.bidIdx + 1} de 4. Tu equipo: ${teamIcons(T.teams[pid])}. Elige 1 de estos 3.`,
      cb:c => { T.teams[pid].push({ ...c, buff:{ hp:0, atk:0, def:0 } }); T.picks[pid] = c; T.bidIdx++; nextPicker(); } });
  }, `Soy ${T.names[pid]}`);
}
function finishPickDraft(){
  const rows = [0, 1, 2, 3].map(pid => {
    const c = T.picks[pid];
    return `<div class="lrow" style="--c:${tc(c.tag)}"><div class="ring xs" style="--ca:${tc(c.tag)}55"><span>${c.icono}</span></div>
      <div class="lmeta"><b class="disp">${esc(c.nombre)}</b><span style="color:${PC4[pid]}">${esc(T.names[pid])}</span>
      <span style="display:block">Equipo: ${T.teams[pid].length} de 4</span></div></div>`;
  }).join('');
  const lbl = ['', 'Ir a los duelos 1v1', 'Ir a los duelos 2v2', 'Siguiente: Draft 4', 'Tienda y torneo final'][T.draft];
  tshow(`<div class="head"><h2 class="disp">Draft ${T.draft} completado</h2>${muteBtn()}</div>${rows}
    <div class="actions"><button class="btn" data-act="tAfterDraft">${lbl}</button></div>`);
}

/* ---- Tienda de buffs (liga Pick 3): se abre tras la Fase 1, tras la Fase 2 y antes del torneo final ---- */
const BUFFS = { hp:{ amt:15, cost:5, lbl:'HP' }, atk:{ amt:4, cost:8, lbl:'ATK' }, def:{ amt:3, cost:6, lbl:'DEF' } };
const BUFF_MIN = 5;
function startShop(next){ T.shopNext = next; T.shopI = 0; T.shopActive = true; shopTurn(); }
function shopTurn(){
  while (T.shopI < 4 && T.coins[T.shopI] < BUFF_MIN) T.shopI++;
  if (T.shopI >= 4) { T.shopActive = false; return T.shopNext(); }
  const pid = T.shopI; T.shopPid = pid;
  passScreen(T.names[pid], PC4[pid], 'Tienda de buffs: gasta tus monedas en mejorar luchadores. Pasa el móvil a', () => renderShop(pid, true), `Soy ${T.names[pid]}`);
}
function renderShop(pid, anim){
  const html = `<div class="head"><h2 class="disp" style="color:${PC4[pid]}">Tienda · ${esc(T.names[pid])}</h2>${muteBtn()}</div>
    <p class="note2">Tienes <b>${T.coins[pid]} 🪙</b>. Los buffs son permanentes para ese luchador. Lo que no gastes, lo conservas.</p>
    ${T.teams[pid].map((m, i) => {
      const bf = m.buff || { hp:0, atk:0, def:0 };
      return `<div class="bcard" style="--c:${tc(m.tag)};--ca:${tc(m.tag)}55">
        <div class="bt"><div class="ring xs"><span>${m.icono}</span></div>
          <div><b class="disp">${esc(m.nombre)}</b><div class="note" style="font-size:13px;color:var(--mute)">HP ${m.hp + bf.hp} · ATK ${m.atk + bf.atk} · DEF ${m.def + bf.def}</div></div></div>
        <div class="shopgrid">${Object.keys(BUFFS).map(k => `<button class="buy" data-act="buy" data-i="${i}" data-k="${k}" ${T.coins[pid] < BUFFS[k].cost ? 'disabled' : ''}>+${BUFFS[k].amt} ${BUFFS[k].lbl}<small>${BUFFS[k].cost} 🪙</small></button>`).join('')}</div>
      </div>`;
    }).join('')}
    <div class="actions"><button class="btn" data-act="shopDone">Terminar compras</button></div>`;
  if (anim) tshow(html); else $('#scr-t').innerHTML = html;
}

Object.assign(ACT, {
  tab(b){ MENU_TAB = +b.dataset.t; SFX.click(); renderMode(); },
  mode2p(){ SFX.click(); renderSetupPick2(); show('setup'); },
  mode4p(){ SFX.click(); renderSetup4(null, 'pick'); show('setup4'); },
  startPick2(){
    let a = $('#n0').value.trim() || 'Jugador 1', b = $('#n1').value.trim() || 'Jugador 2';
    if (a.toLowerCase() === b.toLowerCase()) b += ' 2';
    resetColors(); SFX.bid(); newGame([a, b]); S.pick = true; S.pkIdx = 0; nextPick2();
  },
  startPick4(){ const names = readNames4(); SFX.bid(); newTournament(names, 'pick'); startDraft(); },
  pkSel(b){
    const i = +b.dataset.i; PK.sel = i; SFX.click();
    PK.cards.forEach((c, j) => { const e = $('#pk' + j); if (e) e.classList.toggle('sel', j === i); });
    const bt = $('#pkBtn'); bt.disabled = false; bt.textContent = 'Elegir a ' + PK.cards[i].nombre;
  },
  pkOk(){ if (PK.sel < 0) return; const c = PK.cards[PK.sel]; PK.sel = -1; SFX.coin(); PK.cb(c); },
  buy(b){
    const pid = T.shopPid, m = T.teams[pid][+b.dataset.i], k = b.dataset.k, bf = BUFFS[k];
    if (!m || !bf || T.coins[pid] < bf.cost) return;
    T.coins[pid] -= bf.cost; T.spent[pid] += bf.cost; m.buff[k] += bf.amt; SFX.coin(); vib(15); renderShop(pid, false);
  },
  shopDone(){ SFX.click(); T.shopI++; shopTurn(); }
});

Object.assign(ACT, {
  mode2(){ SFX.click(); renderSetup(); show('setup'); },
  mode4(){ SFX.click(); renderSetup4(); show('setup4'); },
  toMode(){ SFX.click(); renderMode(); show('mode'); },
  start4(){
    const names = [0, 1, 2, 3].map(i => ($('#t' + i).value.trim() || 'Jugador ' + (i + 1)));
    const seen = new Set(); names.forEach((n, i) => { let k = n; while (seen.has(k.toLowerCase())) k = n + ' ' + (i + 1); seen.add(k.toLowerCase()); names[i] = k; });
    SFX.bid(); newTournament(names, 'bid'); startDraft();
  },
  tAgain(){ SFX.click(); renderSetup4(T ? T.names : null, T ? T.mode : 'bid'); show('setup4'); },
  tPassOk(){ SFX.click(); if (T && T.passNext) T.passNext(); },
  tStartBids(){ SFX.click(); if (T.mode === 'pick') nextPicker(); else nextBidder(); },
  bidPlus(b){ const i = +b.dataset.i, pid = T.curPid; if (T.cur[i] + 1 > bidMax(pid)) return; T.cur[i]++; SFX.click(); paintBid(pid); },
  bidMinus(b){ const i = +b.dataset.i; if (T.cur[i] <= 1) return; T.cur[i]--; SFX.click(); paintBid(T.curPid); },
  bidOk(){ T.bids[T.curPid] = T.cur.slice(); T.bidIdx++; SFX.bid(); nextBidder(); },
  rvReveal(){ rvReveal(); },
  rvNext(){ SFX.click(); if (T.ri < 3) { T.ri++; renderReveal(); } else finishDraft(); },
  tAfterDraft(){
    SFX.click();
    if (T.draft === 1) startPhase(1); else if (T.draft === 2) startPhase(2);
    else if (T.draft === 3) startDraft(); else if (T.mode === 'pick') startShop(() => startFinal()); else startFinal();
  },
  tNextDuel(){ SFX.click(); duelLineups(); },
  tFight(){ SFX.click(); startBattle(); },
  tAfterDuel(){ SFX.click(); afterDuel(); },
  tRevealSyn(){ revealSyn4(); },
  tToSemis(){ SFX.click(); startPhase('semi'); },
  tUp(b){ moveT(+b.dataset.i, -1); },
  tDown(b){ moveT(+b.dataset.i, 1); },
  tLineupOk(){ SFX.bid(); T.lqi++; lineupNext(); },
  tShare(){ doShare(champText()); }
});

/* ============================== ARRANQUE ============================== */
renderMode();
</script>
</body>
</html>
