<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<title>Draft 20 · Multiverso</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e12; --panel:#171922; --panel2:#1f2230; --line:#2c3040;
  --gold:#e7b53c; --gold2:#ffd978; --red:#a3182b; --neon:#36c8ff;
  --ink:#eceae4; --mute:#8d92a1; --p0:#36c8ff; --p1:#ff3b52;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(54,200,255,.14),transparent 60%),
   radial-gradient(120% 50% at 50% 115%,rgba(163,24,43,.30),transparent 60%),
   repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
.disp{font-family:'Bebas Neue','Impact','Arial Narrow',sans-serif;letter-spacing:.05em;font-weight:400}

#app{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.screen.active{display:flex;animation:scrIn .35s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:15px 18px;font-family:'Bebas Neue','Impact',sans-serif;
  font-size:24px;letter-spacing:.07em;color:#1a1405;background:linear-gradient(180deg,var(--gold2),var(--gold));
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.btn:disabled{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#d4283f,var(--red));color:#fff}
.btn.sm{font-size:19px;padding:11px 14px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Setup */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:18px}
.bigcoin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:84px;color:#2a1d02;
  background:radial-gradient(circle at 32% 28%,#fff1b8,var(--gold) 55%,#9a7216);
  box-shadow:0 0 0 6px #2a1d02,0 0 0 9px var(--gold),0 0 60px rgba(231,181,60,.55);
  animation:coinSpin 5s ease-in-out infinite}
@keyframes coinSpin{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}}
.bigcoin span{display:block;animation:coinCounter 5s ease-in-out infinite}
@keyframes coinCounter{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-180deg)}}
.title{font-size:70px;line-height:.95;margin:18px 0 4px;color:var(--ink)}
.title em{font-style:normal;color:var(--gold)}
.sub{margin:0 12px;color:var(--mute);font-size:16px;line-height:1.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:18px 0 14px}
.panel label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
.panel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font:600 18px 'Barlow',sans-serif;padding:11px 12px;margin-bottom:12px;outline:none}
.panel input:last-child{margin-bottom:0}
.panel input:focus{border-color:var(--gold)}
#n0{border-left:4px solid var(--p0)} #n1{border-left:4px solid var(--p1)}
.rules{list-style:none;padding:0;margin:16px 4px 0;display:grid;gap:8px;color:var(--mute);font-size:14.5px;line-height:1.35}
.rules b{color:var(--ink);font-weight:600}

/* Headers */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{margin:0;font-size:30px;color:var(--gold)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer}

/* Draft */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;transition:box-shadow .25s,border-color .25s}
.pp.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 22px var(--pca)}
.pp .nm{font-weight:700;font-size:15px;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .coins{display:flex;align-items:baseline;gap:5px;margin:2px 0 6px}
.pp .coins b{font-size:34px;line-height:1;color:var(--gold2)}
.pp .coins small{color:var(--mute);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.slot{aspect-ratio:1;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:20px;background:var(--bg)}
.slot.filled{border:1px solid var(--c);background:radial-gradient(circle,var(--ca),transparent 75%);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.prog{text-align:center;color:var(--mute);font-size:13px;margin:10px 0 6px}
.acard{position:relative;margin:0 auto;width:100%;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--c);border-radius:18px;padding:18px 14px 14px;text-align:center;box-shadow:0 0 40px var(--ca)}
.acard.enter{animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cardIn{from{opacity:0;transform:perspective(600px) rotateY(80deg) scale(.8)}to{opacity:1;transform:none}}
.ring{width:104px;height:104px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:56px;
  background:radial-gradient(circle at 32% 28%,var(--ca),#10121a 72%);box-shadow:0 0 0 3px var(--c),0 0 26px var(--ca)}
.ring.sm{width:58px;height:58px;font-size:30px;box-shadow:0 0 0 2px var(--c),0 0 14px var(--ca)}
.ring.xs{width:44px;height:44px;font-size:24px;margin:0;flex:none;box-shadow:0 0 0 2px var(--c)}
.acard h2{margin:12px 0 6px;font-size:40px;line-height:1}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.chip.hero{color:var(--neon)} .chip.villain{color:#ff6a7d}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 0}
.stats3 b{display:block;font:400 30px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;color:var(--mute)}
.stats3 i{font-style:normal;font-size:11.5px;color:var(--mute)}
.status{text-align:center;margin:12px 4px 10px;font-size:16px;line-height:1.35;min-height:44px}
.status b{color:var(--gold2)}
.bidpill{display:inline-block;background:var(--gold);color:#1a1405;font:400 26px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;padding:5px 14px;border-radius:99px;margin-bottom:6px}
.actions{margin-top:auto;display:grid;gap:10px;padding-top:6px}
.stepper{display:flex;align-items:center;gap:10px}
.sbtn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:58px;height:54px;border-radius:12px;font-size:28px;cursor:pointer}
.sbtn:disabled{opacity:.3}
.sval{flex:1;text-align:center;font-size:38px;color:var(--gold2)}
.note{font-size:12.5px;color:var(--mute);text-align:center}
.sold{background:linear-gradient(90deg,transparent,rgba(231,181,60,.2),transparent);padding:10px 0;animation:pop .4s}

/* Synergy / reveal */
.tblock{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;padding:10px;margin-bottom:12px}
.tblock h3{margin:0 0 8px;font-size:26px;color:var(--pc)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;transition:border-color .3s,box-shadow .3s}
.mcard.rev{border-color:var(--c);box-shadow:0 0 18px var(--ca);animation:flipIn .5s ease}
@keyframes flipIn{0%{transform:rotateY(90deg)}100%{transform:none}}
.mname{font-size:21px;margin:6px 0 3px;line-height:1}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}
.st i{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.st b{font:400 22px/1.1 'Bebas Neue',sans-serif;letter-spacing:.05em;color:var(--mute)}
.mcard.rev .st b{color:var(--ink);animation:pop .35s}
.st sup{font-size:12px;color:#5fe08a;margin-left:1px}
.synlist{display:grid;gap:7px;margin-top:10px}
.syn{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;border:1px solid var(--gold);
  background:linear-gradient(90deg,rgba(231,181,60,.22),rgba(163,24,43,.18));animation:synIn .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes synIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
.syn .si{font-size:26px}
.syn b{display:block;font:400 21px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;color:var(--gold2)}
.syn span{font-size:13px;color:var(--ink)}
.nosyn{color:var(--mute);font-size:13.5px;padding:4px 2px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;background:radial-gradient(circle,rgba(255,217,120,.85),rgba(163,24,43,.35) 60%,transparent 80%)}
#flash.go{animation:flashA .65s ease-out}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}

/* Pass */
.passwrap{margin:auto 0;text-align:center}
.passwrap .big{font-size:56px;line-height:1;margin:6px 0 14px}
.passwrap p{color:var(--mute);margin:0 0 22px;font-size:16px}
.phone{font-size:64px;animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

/* Lineup */
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:12px;padding:9px 10px;margin-bottom:8px;animation:synIn .3s ease}
.lrow .pos{font-size:34px;color:var(--gold);width:26px;text-align:center}
.lmeta{flex:1;min-width:0}
.lmeta b{display:block;font-size:24px;line-height:1}
.lmeta span{font-size:12.5px;color:var(--mute)}
.mv{display:grid;gap:4px}
.mv button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);width:40px;height:30px;border-radius:8px;cursor:pointer;font-size:13px}
.mv button:disabled{opacity:.25}

/* Battle */
.strip{display:flex;gap:6px;justify-content:center}
.tok{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--panel);border:1px solid var(--line);transition:.3s}
.tok.now{border-color:var(--c);box-shadow:0 0 14px var(--c)}
.tok.dead{opacity:.45;filter:grayscale(1)}
.fcard{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-left:4px solid var(--pc);border-radius:16px;padding:12px;transition:transform .17s ease,box-shadow .25s,opacity .5s,filter .5s}
.fcard.turn{box-shadow:0 0 0 1px var(--pc),0 0 24px rgba(255,255,255,.08)}
.fcard.enter{animation:fighterIn .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fighterIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.fcard.top.enter{animation-name:fighterInTop}
@keyframes fighterInTop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.fcard.bottom.enter{animation-name:fighterInBot}
@keyframes fighterInBot{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fcard.lungeUp{transform:translateY(-24px) scale(1.04)}
.fcard.lungeDown{transform:translateY(24px) scale(1.04)}
.fcard.hit{animation:shake .3s}
.fcard.hit::after{content:"";position:absolute;inset:0;border-radius:16px;background:rgba(255,59,82,.4);animation:hitFlash .3s ease-out forwards;pointer-events:none}
@keyframes hitFlash{from{opacity:1}to{opacity:0}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fcard.dead{opacity:.35;filter:grayscale(1)}
.frow{display:flex;gap:12px;align-items:center}
.fmeta{flex:1;min-width:0}
.own{font-size:12.5px;font-weight:700}
.fname{font-size:30px;line-height:1}
.fmeta .chips{justify-content:flex-start;margin-top:4px}
.hpwrap{margin-top:10px}
.hpbar{height:16px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.hpfill{height:100%;width:100%;border-radius:99px;transition:width .45s ease,background .3s}
.hpnum{text-align:right;font:400 18px/1 'Bebas Neue',sans-serif;letter-spacing:.06em;margin-top:3px;color:var(--ink)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.dmg{position:absolute;top:18%;font:400 44px/1 'Bebas Neue',sans-serif;letter-spacing:.05em;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 14px currentColor}
.dmg.red{color:#ff4d63} .dmg.gold{color:var(--gold2);font-size:56px}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-62px) scale(1)}}
.slash{position:absolute;left:8%;right:8%;top:45%;height:4px;background:linear-gradient(90deg,transparent,#fff,var(--gold2),transparent);
  transform:rotate(-14deg) scaleX(0);animation:slashA .28s ease-out forwards;box-shadow:0 0 14px var(--gold)}
@keyframes slashA{0%{transform:rotate(-14deg) scaleX(0);opacity:1}60%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}
.vs{text-align:center;padding:7px 0;min-height:42px;display:flex;align-items:center;justify-content:center;gap:10px}
.vs .v{font-size:30px;color:var(--gold);line-height:1}
#vsline{font-size:13.5px;color:var(--mute);max-width:260px;line-height:1.25}
.bctl{margin-top:auto;padding-top:10px;display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.ko{position:absolute;left:50%;top:48%;font:400 120px/1 'Bebas Neue',sans-serif;color:var(--gold2);letter-spacing:.06em;
  text-shadow:0 0 34px var(--red),5px 5px 0 var(--red);opacity:0;pointer-events:none;z-index:30;transform:translate(-50%,-50%)}
.ko.show{animation:koA 1.1s ease forwards}
@keyframes koA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}}

/* Victory */
.crown{font-size:62px;text-align:center;animation:pop .6s}
.wname{font-size:62px;line-height:.95;text-align:center;margin:2px 0 4px}
.wsub{text-align:center;color:var(--mute);font-size:15px;margin-bottom:14px}
.mvp{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(231,181,60,.2),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:12px}
.mvp .ring{margin:0;width:70px;height:70px;font-size:38px;flex:none}
.mvp small{color:var(--gold2);font-weight:700;font-size:12.5px}
.mvp b{display:block;font-size:30px;line-height:1}
.mvp span{font-size:13.5px;color:var(--mute)}
.sumtab{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:14px}
.sumrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.sumrow:last-child{border:0}
.sumrow .k{color:var(--mute)}
.sumrow .v{text-align:center;font-weight:700}
.sumrow.hd .v{font:400 22px/1 'Bebas Neue',sans-serif;letter-spacing:.05em}
.sumrow .v small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;line-height:1.2}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);background:var(--gold);color:#1a1405;
  font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <section id="scr-setup" class="screen active"></section>
  <section id="scr-draft" class="screen"></section>
  <section id="scr-synergy" class="screen"></section>
  <section id="scr-pass" class="screen"></section>
  <section id="scr-lineup" class="screen"></section>
  <section id="scr-battle" class="screen"></section>
  <section id="scr-win" class="screen"></section>
</div>
<div id="flash"></div>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ============================== UTILIDADES ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }
function flash(){ const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
const PCOL = ['#36c8ff', '#ff3b52'];
const PCOLA = ['rgba(54,200,255,.35)', 'rgba(255,59,82,.35)'];

/* ============================== AUDIO (Web Audio API) ============================== */
let AC = null, muted = false, NB = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = .14, when = 0, slide = 0){
  if (muted) return; const c = ac(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .25, when = 0, freq = 900){
  if (muted) return; const c = ac(); if (!c) return;
  if (!NB) { NB = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = c.currentTime + when, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  click(){ tone(520, .06, 'square', .06); },
  bid(){ tone(660, .09, 'triangle', .13); tone(880, .14, 'triangle', .13, .08); },
  raise(){ tone(440, .08, 'square', .08); tone(740, .12, 'square', .08, .07); },
  coin(){ tone(1250, .07, 'square', .07); tone(1700, .16, 'square', .07, .07); },
  flip(){ tone(900, .05, 'sine', .08); tone(1300, .05, 'sine', .06, .04); },
  hit(){ noise(.16, .35, 0, 700); tone(170, .16, 'sawtooth', .2, 0, -110); },

const slotsLeft = p => 4 - S.teams[p].length;

const maxBid = p => S.coins[p] - (slotsLeft(p) - 1);

function startRound(){
  if (S.teams[0].length === 4 && S.teams[1].length === 4) return goSynergy();
  S.cur = S.deck[S.round]; S.newCard = true; S.openBid = 1;
  const f0 = S.teams[0].length === 4, f1 = S.teams[1].length === 4;
  if (f0 || f1) { S.phase = 'auto'; S.autoP = f0 ? 1 : 0; }
  else { S.phase = 'open'; S.opener = S.openCount % 2; S.openCount++; S.bid = 0; }
  renderDraft();
}
function award(p, price){
  SFX.coin();
  S.coins[p] -= price; S.spent[p] += price; S.teams[p].push(S.cur);
  S.round++; S.phase = 'sold'; S.sold = { p, price }; S.newCard = false;
  renderDraft();
  setTimeout(startRound, 1400);
}

}

/* ============================== SINERGIAS: construcción y pantalla ============================== */
function buildTeam(p){
  const team = S.teams[p], cnt = {};
  team.forEach(m => cnt[m.tag] = (cnt[m.tag] || 0) + 1);
  const act = SYN.filter(s => s.test(cnt));
  const b = { hp:0, atk:0, def:0 };
  act.forEach(s => { for (const k in s.b) b[k] += s.b[k]; });
  S.syn[p] = act;
  S.fin[p] = team.map(m => ({ ...m, base:{ hp:m.hp, atk:m.atk, def:m.def }, bonus:b,
    hp:m.hp + b.hp, maxhp:m.hp + b.hp, atk:m.atk + b.atk, def:m.def + b.def, dealt:0, kills:0, alive:true, owner:p }));
}
function goSynergy(){
  buildTeam(0); buildTeam(1); S.revealed = false;
  renderSyn(); show('synergy');
}

  return `<div class="mcard" id="mc${p}${i}" style="--c:${tc(m.tag)};--ca:${tc(m.tag)}55">

}

      <div class="synlist" id="syn${p}"></div></div>`).join('')}
    <div class="actions" style="padding-bottom:4px"><button class="btn" id="synBtn" data-act="reveal">Revelar stats</button></div>`;
}
async function revealStats(){
  if (S.revealed) return; S.revealed = true;
  const btn = $('#synBtn'); btn.disabled = true;
  for (let p = 0; p < 2; p++) for (let i = 0; i < 4; i++) {
    const m = S.fin[p][i], card = $('#mc' + p + i);
    card.classList.add('rev'); SFX.flip(); vib(12);
    card.querySelectorAll('b[data-k]').forEach(b => {
      const k = b.dataset.k, bo = m.bonus[k];
      b.innerHTML = m[k] + (bo ? `<sup>+${bo}</sup>` : '');
    });
    await sleep(230);
  }
  await sleep(250);
  for (let p = 0; p < 2; p++) {
    const box = $('#syn' + p);
    if (!S.syn[p].length) { box.innerHTML = `<div class="nosyn">Sin sinergias activas.</div>`; continue; }
    for (const s of S.syn[p]) {
      box.insertAdjacentHTML('beforeend', `<div class="syn"><div class="si">${s.ico}</div><div><b>${s.name}</b><span>${bonusTxt(s.b)} a todos</span></div></div>`);
      SFX.synergy(); flash(); vib([30, 30, 60]);
      await sleep(650);
    }
  }
  btn.textContent = 'Preparar alineación'; btn.dataset.act = 'toLineup'; btn.disabled = false;
}

function paintFighter(p, entering){
  const f = cur(p), el = $('#f' + p);
  el.className = 'fcard ' + (p === 0 ? 'bottom' : 'top') + (entering ? ' enter' : '');
  el.style.setProperty('--pc', PCOL[p]);
  el.innerHTML = `<div class="fx"></div>
    <div class="frow"><div class="ring sm" style="--c:${tc(f.tag)};--ca:${tc(f.tag)}55"><span>${f.icono}</span></div>
      <div class="fmeta"><div class="own" style="color:${PCOL[p]}">${esc(S.names[p])}</div>

      <div class="chips"><span class="chip" style="color:${tc(f.tag)}">${f.tag}</span><span class="chip">ATK ${f.atk}</span><span class="chip">DEF ${f.def}</span></div></div></div>
    <div class="hpwrap"><div class="hpbar"><div class="hpfill" id="bar${p}"></div></div><div class="hpnum" id="hp${p}"></div></div>`;
  setHP(p);
}
function setHP(p){
  const f = cur(p), pct = Math.max(0, f.hp / f.maxhp * 100), bar = $('#bar' + p);
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'linear-gradient(90deg,#1b94c8,#36c8ff)' : pct > 25 ? 'linear-gradient(90deg,#b98113,#e7b53c)' : 'linear-gradient(90deg,#8c1220,#ff3b52)';
  $('#hp' + p).textContent = `${f.hp} / ${f.maxhp}`;
}
function paintStrip(p){
  $('#strip' + p).innerHTML = S.fin[p].map((m, i) =>
    `<div class="tok ${m.alive ? '' : 'dead'} ${i === S.pos[p] && m.alive ? 'now' : ''}" style="--c:${tc(m.tag)}">${m.alive ? m.icono : '☠️'}</div>`).join('');
}
function updateTurn(){
  $('#f0').classList.toggle('turn', S.atk === 0); $('#f1').classList.toggle('turn', S.atk === 1);
  const b = $('#atkBtn'); if (b) b.textContent = `Atacar con ${cur(S.atk).nombre}`;
}
function updateCtl(){
  const b = $('#atkBtn'), a = $('#autoBtn'); if (!b) return;
  b.disabled = S.busy || S.auto || S.ended;
  a.textContent = S.auto ? 'Pausar' : 'Auto';
  a.disabled = S.ended;
}
function popup(p, txt, cls){
  const fx = document.querySelector('#f' + p + ' .fx'); if (!fx) return;
  const d = document.createElement('div'); d.className = 'dmg ' + cls; d.textContent = txt;
  d.style.left = (28 + Math.random() * 40) + '%'; fx.appendChild(d); setTimeout(() => d.remove(), 1050);
  const s = document.createElement('div'); s.className = 'slash'; fx.appendChild(s); setTimeout(() => s.remove(), 350);
}
async function attack(){
  if (S.busy || S.ended) return; S.busy = true; updateCtl();
  const a = S.atk, d = 1 - a, A = cur(a), D = cur(d);
  const dmg = Math.max(5, A.atk - D.def);
  const ael = $('#f' + a), del = $('#f' + d);
  ael.classList.add(a === 0 ? 'lungeUp' : 'lungeDown'); await sleep(170);
  SFX.hit(); vib(30);
  D.hp = Math.max(0, D.hp - dmg); A.dealt += dmg; S.dmgTotal[a] += dmg;
  del.classList.add('hit'); popup(d, `-${dmg} HP`, dmg >= 25 ? 'gold' : 'red'); setHP(d);
  $('#vsline').textContent = `${A.nombre} golpea a ${D.nombre} (${dmg}).`;
  await sleep(280);
  ael.classList.remove('lungeUp', 'lungeDown'); del.classList.remove('hit');
  if (D.hp <= 0) await knockout(a, d);
  else { S.atk = d; updateTurn(); await sleep(220); }
  S.busy = false; updateCtl();
  if (S.auto && !S.ended) setTimeout(attack, 250);
}
async function knockout(a, d){
  const A = cur(a), D = cur(d);
  D.alive = false; A.kills++; SFX.ko(); vib([60, 40, 100]); flash();
  $('#f' + d).classList.add('dead'); paintStrip(d);
  const ko = $('#ko'); ko.classList.remove('show'); void ko.offsetWidth; ko.classList.add('show');
  $('#vsline').textContent = `${D.nombre} cae. ${A.nombre} sigue en pie con ${A.hp} HP.`;
  await sleep(1150);
  if (S.pos[d] + 1 >= 4) { S.ended = true; endGame(a); return; }
  S.pos[d]++; paintFighter(d, true); paintStrip(d); S.atk = d; updateTurn();
  $('#vsline').textContent = `${cur(d).nombre} entra al ring.`;
  SFX.bid(); await sleep(650);
}

/* ============================== VICTORIA ============================== */
function endGame(w){
  const l = 1 - w, all = [...S.fin[0], ...S.fin[1]];
  const mvp = all.slice().sort((x, y) => y.dealt - x.dealt || y.kills - x.kills)[0];
  const alive = S.fin[w].filter(m => m.alive).length;
  S.result = { w, l, mvp, alive };
  const synTxt = p => S.syn[p].length ? S.syn[p].map(s => s.name).join(', ') : 'Ninguna';
  $('#scr-win').innerHTML = `
    <div class="crown">🏆</div>
    <div class="wname disp" style="color:${PCOL[w]}">${esc(S.names[w])}</div>
    <div class="wsub">gana con ${alive} ${alive === 1 ? 'luchador' : 'luchadores'} en pie</div>
    <div class="mvp" style="--c:${tc(mvp.tag)};--ca:${tc(mvp.tag)}55">
      <div class="ring"><span>${mvp.icono}</span></div>
      <div><small>MVP de la partida</small><b class="disp">${mvp.nombre}</b>
      <span>${mvp.dealt} de daño · ${mvp.kills} K.O. · de ${esc(S.names[mvp.owner])}</span></div>
    </div>
    <div class="sumtab">
      <div class="sumrow hd"><div></div><div class="v" style="color:${PCOL[0]}">${esc(S.names[0])}</div><div class="v" style="color:${PCOL[1]}">${esc(S.names[1])}</div></div>
      <div class="sumrow"><div class="k">Monedas gastadas</div><div class="v">${S.spent[0]} 🪙</div><div class="v">${S.spent[1]} 🪙</div></div>
      <div class="sumrow"><div class="k">Daño total</div><div class="v">${S.dmgTotal[0]}</div><div class="v">${S.dmgTotal[1]}</div></div>
      <div class="sumrow"><div class="k">Sinergias</div><div class="v"><small>${synTxt(0)}</small></div><div class="v"><small>${synTxt(1)}</small></div></div>
    </div>
    <div class="actions" style="padding-bottom:4px">
      <button class="btn" data-act="share">Compartir resumen</button>
      <button class="btn ghost" data-act="again">Revancha</button></div>`;
  show('win'); SFX.win(); vib([80, 50, 80, 50, 160]); confetti();
}
function shareText(){
  const { w, l, mvp } = S.result;
  const syn = p => S.syn[p].length ? S.syn[p].map(s => s.name).join(', ') : 'ninguna';
  return `🏆 Draft 20 · Multiverso\n${S.names[w]} vence a ${S.names[l]}\n` +
    `MVP: ${mvp.icono} ${mvp.nombre} (${mvp.dealt} de daño, ${mvp.kills} K.O.)\n` +
    `Monedas gastadas: ${S.names[0]} ${S.spent[0]} · ${S.names[1]} ${S.spent[1]}\n` +
    `Daño total: ${S.names[0]} ${S.dmgTotal[0]} · ${S.names[1]} ${S.dmgTotal[1]}\n` +
    `Sinergias: ${S.names[0]} → ${syn(0)} | ${S.names[1]} → ${syn(1)}`;
}
function confetti(){
  const cv = $('#confetti'), cx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.display = 'block';
  const cols = ['#e7b53c', '#ffd978', '#ff3b52', '#36c8ff', '#ffffff', '#a3182b'];
  const P = Array.from({ length: 150 }, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height * .6, w: (6 + Math.random() * 8) * dpr, h: (8 + Math.random() * 10) * dpr,
    vy: (2 + Math.random() * 4) * dpr, vx: (Math.random() - .5) * 3 * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function loop(t){
    cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (t - t0 < 6000 && P.some(p => p.y < cv.height + 30)) requestAnimationFrame(loop);
    else { cx.clearRect(0, 0, cv.width, cv.height); cv.style.display = 'none'; }
  })(t0);
}

/* ============================== ACCIONES (delegación de eventos) ============================== */
const ACT = {
  start(){
    let a = $('#n0').value.trim() || 'Jugador 1', b = $('#n1').value.trim() || 'Jugador 2';
    if (a.toLowerCase() === b.toLowerCase()) b += ' 2';
    SFX.bid(); newGame([a, b]); startRound(); show('draft');
  },
  mute(){ muted = !muted; document.querySelectorAll('[data-act="mute"]').forEach(b => b.textContent = muted ? '🔇' : '🔊'); if (!muted) SFX.click(); },
  openMinus(){ S.openBid = Math.max(1, S.openBid - 1); SFX.click(); renderDraft(); },
  openPlus(){ S.openBid = Math.min(maxBid(S.opener), S.openBid + 1); SFX.click(); renderDraft(); },
  openConfirm(){
    if (S.phase !== 'open') return;
    S.bid = S.openBid; S.bidder = S.opener; S.turn = 1 - S.opener; S.phase = 'respond'; SFX.bid(); renderDraft();
  },
  raise(){
    if (S.phase !== 'respond' || S.bid + 1 > maxBid(S.turn)) return;
    S.bid++; S.bidder = S.turn; S.turn = 1 - S.turn; SFX.raise(); renderDraft();
  },
  cede(){ if (S.phase !== 'respond') return; award(S.bidder, S.bid); },
  claim(){ if (S.phase !== 'auto') return; award(S.autoP, 1); },
  reveal(){ revealStats(); },
  toLineup(){
    S.lineupP = 0; SFX.click();
    showPass(0, () => { renderLineup(); show('lineup'); }, 'Hora de alinear. Pasa el móvil a');
  },
  passOk(){ SFX.click(); if (S.passNext) S.passNext(); },
  up(b){ moveFighter(+b.dataset.i, -1); },
  down(b){ moveFighter(+b.dataset.i, 1); },
  lineupOk(){
    SFX.bid();
    if (S.lineupP === 0) { S.lineupP = 1; showPass(1, () => { renderLineup(); show('lineup'); }, 'Ahora te toca. Pasa el móvil a'); }
    else startBattle();
  },
  attack(){ if (!S.auto) attack(); },
  auto(){
    if (S.ended) return; S.auto = !S.auto; SFX.click(); updateCtl();
    if (S.auto && !S.busy) attack();
  },
  async share(){
    const t = shareText();
    try {
      if (navigator.share) { await navigator.share({ text: t }); return; }
      await navigator.clipboard.writeText(t); toast('Resumen copiado');
    } catch (e) {
      try {
        const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); toast('Resumen copiado');
      } catch (e2) { toast('No se pudo copiar'); }
    }
  },
  again(){ SFX.click(); const n = S ? S.names : null; renderSetup(n); show('setup'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { if (!['mute', 'attack', 'auto', 'openMinus', 'openPlus', 'up', 'down', 'passOk', 'start', 'again'].includes(b.dataset.act)) SFX.click(); f(b); }
});

/* ============================== ARRANQUE ============================== */
renderSetup();
</script>
</body>
